<div class="answer-component">
    <app-video-input #videoInput (currentTime)="setCurrentVideoTime($event)" (onRecordReady)="setUserChoise($event)" (onStartRecord)="startRecord()"></app-video-input>
    <div class="video-controls-menu" [ngClass]="{'hide-controls':hideControls}">
        <p-button  (click)="startRecord()" icon="pi pi-caret-right" [rounded]="true"></p-button>
    </div>
    <div class="video-controls-text" *ngIf="startCountdown || userAnswer" [ngClass]="{'move-top':true}">
        <div>{{questionText()}}</div>
    </div>
</div>
