<p-card [header]="data?.title" [subheader]="data?.subheader"  >
    <ng-template pTemplate="header">
        <img alt="Card" [src]="data?.img" />
    </ng-template>
    <p>{{data?.text}}</p> 
    <div class="flex flex-wrap align-items-center justify-content-between gap-3 h-3rem" *ngIf="!data?.noControl">
        <p-button [label]="data!.systemGroup.startBtn"  (click)="submit()" [style]="{float:'right'}"></p-button>    
    </div>
</p-card>
